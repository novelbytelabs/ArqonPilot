site_name: Arqon Pilot
site_url: "https://novelbytelabs.github.io/ArqonPilot/"
repo_url: https://github.com/novelbytelabs/ArqonPilot/
repo_name: ArqonPilot
dev_addr: 127.0.0.1:8037

theme:
  name: "material"
  logo: assets/arqon_a.png
  favicon: assets/favicon.ico
  palette:
    scheme: slate
    primary: navy blue
    accent: light blue
  features:
    - navigation.sections
    - navigation.expand
    #    - toc.integrate
    # - search.suggest
    # - search.highlight
    - content.tabs.link
    - content.code.annotate
    - navigation.top
    - announce.dismiss
    - content.code.copy
    - content.action.copy
    - content.action.view

nav:
  - Home: "index.md"
  - Pilot Deep Dive & Plan: "pilot-deep-dive-plan.md"
  - Branch Management Guide: "branch-management-guide.md"
  - Wave 0.5 Validation: "project/wave-0_5-validation.md"
  - Wave 1 Modularization: "project/wave-1-modularization.md"
  - Wave 2 Multi Foundation: "project/wave-2-multi-foundation.md"
  - Wave 3 Branch + Navigate Orchestration: "project/wave-3-branch-navigate-orchestration.md"
  - Wave 4 Secure + Heal Expansion: "project/wave-4-secure-heal-expansion.md"
  - Wave 5 Plan + Create + Know: "project/wave-5-plan-create-know.md"
  - Wave 6 Acceptance + Dogfooding: "project/wave-6-acceptance-and-dogfooding.md"

markdown_extensions:
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - def_list
  - pymdownx.snippets
  - pymdownx.progressbar
  - pymdownx.magiclink
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Custom CSS file for additional styling
extra_css:
  - stylesheets/extra.css

# This tells mkdocs where your documentation source files are
docs_dir: "docs"

# This allows GitHub Actions to deploy the site to the gh-pages branch
edit_uri: edit/main/docs/

# Additional configuration
# plugins:
#   - search:
#       separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.|'

# Extra configuration
extra:
  version: "1.0.0"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelbytelabs/arqonbus
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/arqoncloud
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/novelbytelabs/arqonbus/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">telling us what you found helpful or what could be improved</a>.

copyright: "Copyright &copy; 2026 NovelByte Labs - All rights reserved."
