site_name: Arqon Pilot
site_url: "https://novelbytelabs.github.io/ArqonPilot/"
repo_url: https://github.com/novelbytelabs/ArqonPilot/
repo_name: ArqonPilot
dev_addr: 127.0.0.1:8037

theme:
  name: "material"
  logo: assets/favicon.ico
  favicon: assets/favicon.ico
  features:
    #    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.tracking
    - toc.follow
    - content.tabs.link
    - content.code.annotate
    - navigation.top
    - content.code.copy
    - search.highlight
    - search.suggest
    - navigation.instant
  palette:
    - scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to Light mode
    - scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to Dark mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: "index.md"
  - Roadmap & Plan:
      - PRODUCTIONIZE: "PRODUCTIONIZE.md"
      - Productionize Value: "productionize-value.md"
  - Federated CI Program:
      - Master Program: "project_plan_pilot_federated_ci_program.md"
      - Control Plane Detail: "project_plan_ci_cd_control_plane.md"
      - Orchestrator Detail: "project_plan_pilot_ci_orchestrator.md"
      - Plan: "federated-ci-program-plan.md"
      - Value: "federated-ci-program-value.md"
  - Governance & Policy:
      - Governance Guide: "governance-guide.md"
      - Branch Management Guide: "branch-management-guide.md"
      - Settings & Governance Plan: "settings-tab-and-governance-plan.md"
  - Operations & Support:
      - Operator Runbook: "operator-runbook.md"
      - Troubleshooting: "troubleshooting.md"
      - Testing Strategy: "testing-strategy.md"
      - Tech Debt: "tech-debt.md"
  - Release Management:
      - Release Playbook: "release-playbook.md"
      - Release Log: "release-log.md"
      - P9 Hard-Close Checklist: "p9-hard-close-checklist.md"
      - Releases:
          - 0.2.0-alpha.1: "releases/0.2.0-alpha.1.md"
  - Integration & Architecture:
      - Arqon Bus Integration: "bus-integration-guide.md"
      - Pilot Oracle Reflex Analysis: "pilot-oracle-reflex-analysis.md"
  - Vision:
      - Pilot Vision Alignment: "pilot_vision_alignment.md"
      - Vision: "vision.md"
      - Plan: "plan.md"
  - Policies & Standards:
      - Channel Policy: "channel-policy.md"
      - Compatibility Matrix: "compatibility-matrix.md"
      - SLO Policy: "slo-policy.md"
  - Incident Management:
      - Incident Runbook: "incident-runbook.md"
      - Gotcha Registry: "gotcha-registry.md"
  - Migration & Deployment:
      - Migration Playbook: "migration-playbook.md"
  - Development:
      - Developer Guide: "developer-guide.md"
  - Tutorials:
      - AGOrg Interface: "tutorial/agorg-interface.md"
      - Pilot for Pilot Tutorial: "tutorial/pilot-for-pilot-tutorial.md"
  - FC Artifacts:
      - Context Verification: "fc1_artifacts/context_verification.md"
      - FC2 Hardclose: "fc1_artifacts/fc2_hardclose.md"
      - FC3 Hardclose: "fc1_artifacts/fc3_hardclose.md"
      - FC4 Hardclose: "fc1_artifacts/fc4_hardclose.md"
      - FC5 Hardclose: "fc1_artifacts/fc5_hardclose.md"
      - FC6 Hardclose: "fc1_artifacts/fc6_hardclose.md"
      - FC8 Hardclose: "fc1_artifacts/fc8_hardclose.md"
      - FC9 Hardclose: "fc1_artifacts/fc9_hardclose.md"
      - FC9 Post-Audit Remediation: "fc1_artifacts/fc9_post_audit_remediation_2026-03-03.md"
      - Federated CI Parity Matrix: "fc1_artifacts/federated_ci_parity_matrix.md"
      - Federated Gate Contract Schema: "fc1_artifacts/federated_gate_contract_schema.md"
      - Repo Gate Entry Inventory: "fc1_artifacts/repo_gate_entry_inventory.md"
  - Releases:
      - P7 Evidence Bundle: "releases/p7_evidence_bundle.md"

markdown_extensions:
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
  - tables
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.details

  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - md_in_html
  - def_list
  - pymdownx.snippets
  - pymdownx.progressbar
  - pymdownx.magiclink
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/theme.js
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# Custom CSS file for additional styling
extra_css:
  - stylesheets/extra.css

# This tells mkdocs where your documentation source files are
docs_dir: "docs"

# This allows GitHub Actions to deploy the site to the gh-pages branch
edit_uri: edit/main/docs/

# Additional configuration
# plugins:
#   - search:
#       separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.|'

# Extra configuration
extra:
  version: "0.2.0-alpha.1 (planned)"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/novelbytelabs/arqonbus
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/arqoncloud
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            <a href="https://github.com/novelbytelabs/arqonbus/issues/new/?title=[Feedback]+{title}+-+{url}" target="_blank" rel="noopener">telling us what you found helpful or what could be improved</a>.

copyright: "Copyright &copy; 2026 NovelByte Labs - All rights reserved."

plugins:
  - search:
  - git-revision-date-localized:
      enabled: true
      type: date
      locale: en
      fallback_to_build_date: true
  - minify:
      minify_html: true
