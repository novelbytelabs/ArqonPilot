name: ArqonPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Wave 0 Safety Invariants
        run: ./scripts/wave0_safety_check.sh

      - name: Toolchain and Lockfile Policy
        run: ./scripts/verify_toolchain_policy.sh

      - name: Check
        run: cargo check -p pilot --locked

      - name: Test Matrix
        run: ./scripts/test_matrix.sh all

      - name: Release Readiness
        run: ./scripts/release_readiness_check.sh
