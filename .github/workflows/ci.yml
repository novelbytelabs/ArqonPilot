name: ArqonPilot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
          components: rustfmt, clippy

      - name: Install pinned protoc (25.8)
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.8/protoc-25.8-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version | grep -F "25.8"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Wave 0 Safety Invariants
        run: ./scripts/wave0_safety_check.sh

      - name: Toolchain and Lockfile Policy
        run: ./scripts/verify_toolchain_policy.sh

      - name: Drift Family Scan (Core Lock)
        run: ./scripts/drift_report.sh Cargo.lock

      - name: Git Hook Policy
        run: ./scripts/verify_git_hook_policy.sh

      - name: Check
        run: cargo check -p pilot --locked

      - name: Test Matrix
        run: ./scripts/test_matrix.sh all

      - name: Release Readiness
        run: ./scripts/release_readiness_check.sh

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Install pinned protoc (25.8)
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.8/protoc-25.8-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version | grep -F "25.8"

      - name: UI Smoke Check (Deterministic)
        env:
          PILOT_UI_SMOKE_START_SHIM: "0"
          PILOT_UI_SMOKE_INCLUDE_COMMANDS: "1"
          PILOT_UI_PORT: "7791"
          PILOT_UI_SMOKE_STARTUP_TIMEOUT_SEC: "1200"
        run: ./scripts/ui_smoke_check.sh

      - name: Upload UI Smoke Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-logs
          if-no-files-found: ignore
          path: |
            ~/.pilot/reports/ui_smoke_*.log
            /tmp/pilot-reports/ui_smoke_*.log

  packaging-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (Packaging Lane)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Install core lane toolchain for policy check
        run: rustup toolchain install 1.82.0

      - name: Install pinned protoc (25.8)
        run: |
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.8/protoc-25.8-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version | grep -F "25.8"

      - name: Toolchain and Lockfile Policy
        run: ./scripts/verify_toolchain_policy.sh

      - name: Drift Family Scan (Core Lock)
        run: ./scripts/drift_report.sh Cargo.lock

      - name: Drift Family Scan (Packaging Lock Report)
        run: ./scripts/drift_report.sh Cargo.lock.packaging --json

      - name: Packaging Lane Check
        run: ./scripts/packaging_lane_check.sh
