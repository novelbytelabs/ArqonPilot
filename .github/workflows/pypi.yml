name: PyPI Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # Packaging-only exception:
      # PyPI build currently resolves transitive crates (wasip2/wit-bindgen path)
      # that require Rust >=1.88. Keep repository/toolchain policy at 1.82
      # and scope the newer compiler only to this publish workflow.
      # Remove rust-toolchain.toml so maturin uses the version we set below.
      - name: Setup Rust 1.88 (PyPI packaging only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Remove rust-toolchain.toml for PyPI build
        run: rm -f rust-toolchain.toml

      - name: Build wheels and sdist
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist

      - name: Publish to TestPyPI (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

      - name: Publish to PyPI (manual or tag)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi') || github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
