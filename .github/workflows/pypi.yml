name: PyPI Publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target index"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
  push:
    tags:
      - "v*"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Packaging-only exception:
      # PyPI build resolves dependencies that require Rust >=1.88 (time crate).
      # Keep repository/toolchain policy at 1.82 for core dev/test lanes.
      # This packaging lane uses 1.88 explicitly to handle transitive deps.
      # Remove rust-toolchain.toml so maturin uses the version we set below.
      - name: Setup Rust 1.88 (PyPI packaging only)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Remove rust-toolchain.toml for PyPI build
        run: rm -f rust-toolchain.toml

      - name: Use packaging lockfile (deterministic)
        run: |
          test -f Cargo.lock.packaging
          cp Cargo.lock.packaging Cargo.lock

      # Note: Removed preflight cargo build - maturin does its own build anyway
      # The preflight was redundant and took 15+ minutes

      - name: Build wheels and sdist
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          args: --release --sdist --locked --out dist -v
          before-script-linux: yum install -y openssl-devel unzip perl-core make && curl -L https://github.com/protocolbuffers/protobuf/releases/download/v25.8/protoc-25.8-linux-x86_64.zip -o protoc.zip && unzip -o protoc.zip -d /usr/local && rm protoc.zip

      - name: Publish to TestPyPI (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to PyPI (manual or tag)
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi') || github.event_name == 'push'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          password: ${{ secrets.PYPI_API_TOKEN }}
