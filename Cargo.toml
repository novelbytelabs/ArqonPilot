[workspace]
members = [
    "crates/pilot",
    "crates/pilot-core",
    "crates/pilot-oracle",
    "crates/pilot-heal",
    "crates/pilot-navigate",
    "crates/pilot-multi",
    "crates/pilot-branch",
    "crates/pilot-secure",
    "crates/pilot-plan",
    "crates/pilot-create",
    "crates/pilot-know",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
miette = { version = "7.0", features = ["fancy"] }
clap = { version = "4.4", features = ["derive", "env"] }
