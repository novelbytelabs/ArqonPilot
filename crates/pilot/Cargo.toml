[package]
name = "pilot"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
miette = { workspace = true, features = ["fancy"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.21.0"
futures-util = "0.3.31"
axum = "0.7.9"
tokio-stream = { version = "0.1.18", features = ["sync"] }
toml = "0.9.10"
tokio-postgres = { version = "0.7.12", features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { version = "1.11.0", features = ["v4", "serde"] }
pilot-core = { path = "../pilot-core" }
pilot-oracle = { path = "../pilot-oracle" }
pilot-heal = { path = "../pilot-heal" }
pilot-navigate = { path = "../pilot-navigate" }
pilot-multi = { path = "../pilot-multi" }
pilot-branch = { path = "../pilot-branch" }
pilot-secure = { path = "../pilot-secure" }
pilot-plan = { path = "../pilot-plan" }
pilot-create = { path = "../pilot-create" }
pilot-know = { path = "../pilot-know" }

[dev-dependencies]
assert_cmd = "2.1.1"
insta = "1.45.0"
predicates = "3.1.3"
reqwest = "0.12.26"
tempfile = "3.12.0"
rusqlite = { version = "0.37.0", features = ["bundled"] }
tree-sitter = "0.26.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.0"
