[package]
name = "pilot"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { workspace = true, features = ["derive"] }
miette = { workspace = true, features = ["fancy"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.48.0", features = ["full"] }
toml = "0.9.10"
pilot-core = { path = "../pilot-core" }
pilot-oracle = { path = "../pilot-oracle" }
pilot-heal = { path = "../pilot-heal" }
pilot-navigate = { path = "../pilot-navigate" }
pilot-multi = { path = "../pilot-multi" }
pilot-branch = { path = "../pilot-branch" }

[dev-dependencies]
assert_cmd = "2.1.1"
insta = "1.45.0"
predicates = "3.1.3"
reqwest = "0.12.26"
tempfile = "3.12.0"
