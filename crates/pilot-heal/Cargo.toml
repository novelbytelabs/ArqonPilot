[package]
name = "pilot-heal"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.100"
chrono.workspace = true
reqwest = { version = "0.12.26", features = ["blocking", "json"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
